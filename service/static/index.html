<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koja je rasa psa?</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1b1d21; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2f6df6; --warn: #b45309; --warn-bg: #fff7ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1e2125; --fg: #e8eaed; --muted: #9aa1ab;
      --line: #2c3037; --accent: #6b9bff; --warn: #fbbf24; --warn-bg: #2a2214;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 1.25rem; margin-bottom: 1rem; }
  #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 2.5rem 1rem;
          text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #drop p { margin: .25rem 0; color: var(--muted); }
  #preview { max-width: 100%; max-height: 260px; border-radius: 8px; display: block; margin: 0 auto 1rem; }
  .row { display: flex; align-items: center; gap: .75rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .rank { width: 1.5rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .breed { flex: 1; font-weight: 500; }
  .bar { width: 120px; height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .pct { width: 3.6rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px;
          padding: .7rem .9rem; margin-bottom: 1rem; font-size: .92rem; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 1rem;
          display: flex; gap: 1rem; flex-wrap: wrap; }
  .fb { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .fb label { color: var(--muted); font-size: .9rem; display: block; margin-bottom: .4rem; }
  .fb div { display: flex; gap: .5rem; }
  input, button { font: inherit; border-radius: 8px; border: 1px solid var(--line); padding: .5rem .7rem; }
  input { flex: 1; background: var(--bg); color: var(--fg); }
  button { background: var(--accent); color: #fff; border-color: transparent; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #dc2626; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Koja je rasa psa?</h1>
  <p class="sub">Posalji fotografiju — sistem vraca tri najverovatnije rase od njih 120.</p>

  <div class="card">
    <div id="drop">
      <p><strong>Prevuci sliku ovde</strong> ili klikni da izaberes</p>
      <p>JPEG, PNG ili WebP, do 8 MB</p>
    </div>
    <input id="file" type="file" accept="image/*" class="hidden">
  </div>

  <div id="result" class="card hidden"></div>
</main>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const result = document.getElementById('result');
let lastId = null;

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) send(fileInput.files[0]); });

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function send(file) {
  result.classList.remove('hidden');
  result.innerHTML = '<p class="sub">Prepoznajem…</p>';
  const fd = new FormData();
  fd.append('file', file);
  let r, data;
  try {
    r = await fetch('/predict', { method: 'POST', body: fd });
    data = await r.json();
  } catch (e) {
    result.innerHTML = '<p class="err">Greska u komunikaciji sa servisom.</p>';
    return;
  }
  if (!r.ok) {
    result.innerHTML = '<p class="err">' + esc(data.detail || 'Greska') + '</p>';
    return;
  }
  render(data, URL.createObjectURL(file));
}

function render(d, url) {
  lastId = d.request_id;
  const rows = d.predictions.map((p, i) =>
    '<div class="row"><span class="rank">' + (i + 1) + '.</span>' +
    '<span class="breed">' + esc(p.breed.replace(/_/g, ' ')) + '</span>' +
    '<span class="bar"><span style="width:' + (p.probability * 100).toFixed(1) + '%"></span></span>' +
    '<span class="pct">' + (p.probability * 100).toFixed(1) + '%</span></div>').join('');

  result.innerHTML =
    '<img id="preview" src="' + url + '" alt="poslata slika">' +
    (d.message ? '<div class="warn">' + esc(d.message) + '</div>' : '') +
    rows +
    '<div class="meta">' +
      '<span>' + d.latency_ms.toFixed(0) + ' ms</span>' +
      '<span>poverenje ' + (d.signals.top3_mass * 100).toFixed(1) + '%</span>' +
      (d.dog_score !== null ? '<span>pas ' + (d.dog_score * 100).toFixed(0) + '%</span>' : '') +
      '<span>' + esc(d.model_version) + '</span>' +
    '</div>' +
    '<div class="fb"><label for="corr">Nije tacno? Upisi pravu rasu:</label>' +
    '<div><input id="corr" list="breeds" placeholder="npr. cocker_spaniel">' +
    '<button id="send-fb">Posalji</button></div>' +
    '<datalist id="breeds"></datalist><p id="fb-msg" class="sub"></p></div>';

  fetch('/breeds').then(r => r.json()).then(b => {
    document.getElementById('breeds').innerHTML =
      b.breeds.map(x => '<option value="' + esc(x) + '">').join('');
  });
  document.getElementById('send-fb').addEventListener('click', sendFeedback);
}

async function sendFeedback() {
  const input = document.getElementById('corr');
  const msg = document.getElementById('fb-msg');
  const btn = document.getElementById('send-fb');
  if (!input.value.trim()) return;
  btn.disabled = true;
  const r = await fetch('/feedback', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ request_id: lastId, correct_breed: input.value.trim() })
  });
  const d = await r.json();
  msg.textContent = r.ok
    ? (d.was_top3 ? 'Hvala — bila je medju prva tri.' : 'Hvala, zabelezeno.')
    : (d.detail || 'Greska');
  btn.disabled = false;
}
</script>
</body>
</html>
