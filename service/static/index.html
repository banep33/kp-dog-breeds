<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koja je rasa psa?</title>
<style>
  :root {
    --bg0:#050a16; --bg1:#0a1730; --bg2:#0d2149;
    --shell:rgba(8,18,38,.72); --panel:rgba(12,26,52,.55);
    --line:rgba(110,155,235,.16); --line-s:rgba(110,155,235,.32);
    --fg:#e9f0ff; --muted:#8ba2c9; --dim:#5f739a;
    --accent:#3b82f6; --accent-2:#8b5cf6; --accent-soft:rgba(59,130,246,.14);
    --warn:#fbbf24; --warn-bg:rgba(251,191,36,.10); --err:#f87171;
    --r:18px;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; color:var(--fg);
    font:15px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background:
      radial-gradient(1100px 620px at 50% -12%, #16366e 0%, transparent 62%),
      radial-gradient(900px 500px at 50% 112%, #122a57 0%, transparent 60%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg0));
    background-attachment:fixed;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  ::selection { background:rgba(59,130,246,.35); }

  /* ---------- okvir ---------- */
  .shell {
    width:min(1080px,100%); height:min(860px,calc(100vh - 48px));
    display:grid; grid-template-columns:76px 1fr;
    background:var(--shell); border:1px solid var(--line);
    border-radius:28px; overflow:hidden;
    box-shadow:0 40px 110px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(18px);
  }

  /* ---------- leva traka ---------- */
  .rail { display:flex; flex-direction:column; align-items:center; gap:10px;
          padding:18px 0; border-right:1px solid var(--line); }
  .logo { width:40px; height:40px; border-radius:13px; display:grid; place-items:center;
          background:linear-gradient(145deg,var(--accent),var(--accent-2));
          box-shadow:0 8px 22px rgba(59,130,246,.45); margin-bottom:12px; }
  .logo svg { width:22px; height:22px; fill:#fff; }
  .rbtn { width:40px; height:40px; border-radius:13px; border:1px solid var(--line);
          background:var(--panel); color:var(--muted); display:grid; place-items:center;
          cursor:pointer; transition:.16s; padding:0; }
  .rbtn svg { width:18px; height:18px; stroke:currentColor; fill:none;
              stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .rbtn:hover { color:var(--fg); border-color:var(--line-s); background:var(--accent-soft); }
  .rbtn.on { color:#fff; border-color:transparent; background:linear-gradient(145deg,var(--accent),var(--accent-2)); }
  .rail .spacer { flex:1; }

  /* ---------- scena ---------- */
  .stage { position:relative; overflow-y:auto; padding:18px 26px 32px; }
  .stage::-webkit-scrollbar { width:8px; }
  .stage::-webkit-scrollbar-thumb { background:var(--line-s); border-radius:8px; }

  .topbar { display:flex; align-items:center; gap:10px; }
  .badge { display:inline-flex; align-items:center; gap:8px; padding:7px 14px;
           border:1px solid var(--line-s); border-radius:999px; background:var(--panel);
           font-size:12.5px; color:#cfe0ff; letter-spacing:.2px; }
  .dot { width:7px; height:7px; border-radius:50%; background:#22c55e;
         box-shadow:0 0 10px #22c55e; }
  .dot.off { background:var(--err); box-shadow:0 0 10px var(--err); }

  /* ---------- hero ---------- */
  .hero { text-align:center; padding:14px 0 6px; }
  .orb { width:184px; height:184px; margin:6px auto 18px; position:relative;
         display:grid; place-items:center; }
  .orb::before { content:""; position:absolute; inset:-28px; border-radius:50%;
                 background:radial-gradient(circle, rgba(79,140,255,.34), transparent 66%);
                 filter:blur(14px); }
  .orb .ball { position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 42%),
      conic-gradient(from 210deg, #2563eb, #7c3aed, #1d4ed8, #38bdf8, #2563eb);
    box-shadow:inset 0 0 44px rgba(0,0,0,.55), 0 18px 60px rgba(37,99,235,.42);
    animation:spin 22s linear infinite; }
  .orb .glass { position:absolute; inset:14px; border-radius:50%;
    background:radial-gradient(circle at 36% 24%, rgba(255,255,255,.22), transparent 55%);
    border:1px solid rgba(255,255,255,.14); }
  .orb svg { position:relative; width:62px; height:62px; fill:#fff;
             filter:drop-shadow(0 4px 14px rgba(0,0,0,.5)); }
  @keyframes spin { to { transform:rotate(360deg); } }

  h1 { margin:0 0 8px; font-size:clamp(26px,4vw,40px); font-weight:700; letter-spacing:-.6px; }
  h1 .g { background:linear-gradient(95deg,#9ec5ff,#6ea8ff 40%,#a78bfa);
          -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin:0; color:var(--muted); font-size:14px; }

  /* ---------- kompozer ---------- */
  .composer { margin:24px auto 0; max-width:720px; border:1px solid var(--line-s);
              border-radius:var(--r); background:var(--panel); padding:16px 16px 12px;
              transition:border-color .16s, background .16s; }
  .composer.over { border-color:var(--accent); background:var(--accent-soft); }
  .dz { min-height:92px; display:grid; place-items:center; text-align:center;
        cursor:pointer; color:var(--muted); font-size:14px; padding:8px; }
  .dz strong { color:var(--fg); font-weight:600; }
  .dz small { display:block; margin-top:5px; color:#6c83a8; font-size:12px; }
  .staged { display:flex; align-items:center; gap:12px; padding:4px 2px 10px; }
  .staged img { width:60px; height:60px; object-fit:cover; border-radius:12px;
                border:1px solid var(--line-s); }
  .staged .nm { flex:1; min-width:0; }
  .staged .nm b { display:block; font-weight:500; overflow:hidden;
                  text-overflow:ellipsis; white-space:nowrap; }
  .staged .nm span { color:var(--muted); font-size:12.5px; }

  .tools { display:flex; align-items:center; gap:8px; padding-top:10px;
           border-top:1px solid var(--line); }
  .tool { width:34px; height:34px; border-radius:50%; border:1px solid var(--line-s);
          background:transparent; color:var(--muted); cursor:pointer; display:grid;
          place-items:center; padding:0; transition:.16s; }
  .tool:hover { color:var(--fg); border-color:#6ea8ff; }
  .tool svg { width:16px; height:16px; stroke:currentColor; fill:none;
              stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tools .gap { flex:1; }
  .send { width:38px; height:38px; border-radius:50%; border:0; cursor:pointer;
          background:linear-gradient(145deg,var(--accent),var(--accent-2));
          color:#fff; display:grid; place-items:center;
          box-shadow:0 8px 20px rgba(59,130,246,.42); transition:.16s; }
  .send svg { width:17px; height:17px; stroke:#fff; fill:none; stroke-width:1.9;
              stroke-linecap:round; stroke-linejoin:round; }
  .send:disabled { opacity:.35; box-shadow:none; cursor:default; }

  /* ---------- cipovi ---------- */
  .chips { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin:18px auto 0;
           max-width:720px; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:7px 13px;
          border:1px solid var(--line); border-radius:999px; background:var(--panel);
          font-size:12.5px; color:#bcd0ef; }
  .chip i { font-style:normal; color:var(--muted); }

  /* ---------- rezultat ---------- */
  .result { max-width:720px; margin:22px auto 0; }
  .card { border:1px solid var(--line); border-radius:var(--r); background:var(--panel);
          padding:18px; }
  .shot { display:flex; gap:16px; align-items:flex-start; margin-bottom:14px; }
  .shot img { width:116px; height:116px; object-fit:cover; border-radius:14px;
              border:1px solid var(--line-s); }
  .shot .hd { flex:1; min-width:0; }
  .shot .hd h2 { margin:2px 0 4px; font-size:19px; font-weight:600; letter-spacing:-.2px; }
  .shot .hd p { margin:0; color:var(--muted); font-size:13px; }

  .row { display:flex; align-items:center; gap:12px; padding:9px 0;
         border-bottom:1px solid var(--line); }
  .row:last-of-type { border-bottom:0; }
  .rank { width:20px; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .breed { flex:1; font-weight:500; text-transform:capitalize; }
  .bar { width:150px; height:6px; border-radius:6px; background:rgba(110,155,235,.16);
         overflow:hidden; }
  .bar span { display:block; height:100%; border-radius:6px;
              background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
  .row:not(:first-of-type) .bar span { opacity:.55; }
  .pct { width:56px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums;
         font-size:13.5px; }

  .note { display:flex; gap:9px; align-items:flex-start; border-radius:12px; padding:10px 13px;
          margin-bottom:14px; font-size:13.5px; background:var(--warn-bg); color:var(--warn);
          border:1px solid rgba(251,191,36,.22); }
  .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .tag { padding:5px 10px; border:1px solid var(--line); border-radius:8px;
         font-size:12px; color:var(--muted); background:rgba(255,255,255,.02); }

  .fb { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .fb label { display:block; color:var(--muted); font-size:12.5px; margin-bottom:7px; }
  .fb .ln { display:flex; gap:8px; }
  input { flex:1; font:inherit; font-size:14px; color:var(--fg); padding:9px 12px;
          border:1px solid var(--line-s); border-radius:11px; background:rgba(5,12,26,.55); }
  input::placeholder { color:#5d739a; }
  input:focus { outline:none; border-color:var(--accent); }
  .btn { font:inherit; font-size:14px; padding:9px 16px; border:0; border-radius:11px;
         color:#fff; cursor:pointer;
         background:linear-gradient(145deg,var(--accent),var(--accent-2)); }
  .btn:disabled { opacity:.45; cursor:default; }
  .msg { margin:9px 0 0; font-size:13px; color:var(--muted); }
  .msg.err { color:var(--err); }

  .spin { display:inline-block; width:15px; height:15px; border-radius:50%;
          border:2px solid rgba(255,255,255,.18); border-top-color:#6ea8ff;
          animation:spin .8s linear infinite; vertical-align:-2px; margin-right:8px; }

  /* ---------- panel (istorija / rase / status) ---------- */
  .overlay { position:absolute; inset:0; background:rgba(3,8,20,.55);
             backdrop-filter:blur(3px); display:none; z-index:5; }
  .overlay.open { display:block; }
  .panel { position:absolute; top:0; right:0; width:min(380px,88%); height:100%;
           background:#09142b; border-left:1px solid var(--line-s);
           padding:20px; overflow-y:auto; }
  .panel h3 { margin:0 0 4px; font-size:16px; }
  .panel .ph { color:var(--muted); font-size:12.5px; margin:0 0 14px; }
  .panel .x { position:absolute; top:16px; right:16px; }
  .plist { display:flex; flex-direction:column; gap:7px; }
  .pitem { border:1px solid var(--line); border-radius:11px; padding:9px 12px;
           font-size:13px; display:flex; gap:10px; align-items:center; }
  .pitem .k { flex:1; text-transform:capitalize; }
  .pitem .v { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px; }
  .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .pgrid span { font-size:12.5px; color:#bcd0ef; padding:5px 8px; border-radius:8px;
                background:rgba(255,255,255,.03); text-transform:capitalize;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .hidden { display:none !important; }

  @media (max-width:720px) {
    body { padding:0; }
    .shell { height:100vh; border-radius:0; border:0; grid-template-columns:60px 1fr; }
    .stage { padding:16px 14px 26px; }
    .orb { width:132px; height:132px; }
    .bar { width:84px; }
    .shot img { width:84px; height:84px; }
  }
</style>
</head>
<body>

<div class="shell">
  <!-- leva traka -->
  <nav class="rail">
    <div class="logo" title="Prepoznavanje rase psa">
      <svg viewBox="0 0 24 24"><path d="M6.5 11c1.2 0 2-1.3 2-2.8S7.7 5.4 6.5 5.4 4.5 6.7 4.5 8.2 5.3 11 6.5 11zm11 0c1.2 0 2-1.3 2-2.8s-.8-2.8-2-2.8-2 1.3-2 2.8.8 2.8 2 2.8zM10 8.2c1.1 0 1.9-1.3 1.9-2.9S11.1 2.4 10 2.4 8.1 3.7 8.1 5.3 8.9 8.2 10 8.2zm4 0c1.1 0 1.9-1.3 1.9-2.9S15.1 2.4 14 2.4s-1.9 1.3-1.9 2.9.8 2.9 1.9 2.9zM12 10c-2.6 0-4.8 2.4-5.6 4.3-.8 1.9.3 3.9 2.3 4.2 1.1.2 2.1-.3 3.3-.3s2.2.5 3.3.3c2-.3 3.1-2.3 2.3-4.2C16.8 12.4 14.6 10 12 10z"/></svg>
    </div>
    <button class="rbtn on" id="nav-new" title="Nova slika">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="rbtn" id="nav-hist" title="Istorija (ova sesija)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.9"/></svg>
    </button>
    <button class="rbtn" id="nav-breeds" title="Svih 120 rasa">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="rbtn" id="nav-status" title="Status servisa">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7h-.3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.8 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg>
    </button>
  </nav>

  <!-- scena -->
  <section class="stage">
    <div class="topbar">
      <span class="badge"><span class="dot off" id="sdot"></span><span id="slabel">povezujem…</span></span>
    </div>

    <div class="hero" id="hero">
      <div class="orb">
        <div class="ball"></div><div class="glass"></div>
        <svg viewBox="0 0 24 24"><path d="M6.5 11c1.2 0 2-1.3 2-2.8S7.7 5.4 6.5 5.4 4.5 6.7 4.5 8.2 5.3 11 6.5 11zm11 0c1.2 0 2-1.3 2-2.8s-.8-2.8-2-2.8-2 1.3-2 2.8.8 2.8 2 2.8zM10 8.2c1.1 0 1.9-1.3 1.9-2.9S11.1 2.4 10 2.4 8.1 3.7 8.1 5.3 8.9 8.2 10 8.2zm4 0c1.1 0 1.9-1.3 1.9-2.9S15.1 2.4 14 2.4s-1.9 1.3-1.9 2.9.8 2.9 1.9 2.9zM12 10c-2.6 0-4.8 2.4-5.6 4.3-.8 1.9.3 3.9 2.3 4.2 1.1.2 2.1-.3 3.3-.3s2.2.5 3.3.3c2-.3 3.1-2.3 2.3-4.2C16.8 12.4 14.6 10 12 10z"/></svg>
      </div>
      <h1>Koja je <span class="g">rasa psa</span>?</h1>
      <p class="sub">Posalji fotografiju — sistem vraca tri najverovatnije rase od njih 120.</p>
    </div>

    <!-- kompozer -->
    <div class="composer" id="composer">
      <div class="dz" id="dz">
        <div>
          <strong>Prevuci sliku ovde</strong> ili klikni da izaberes
          <small>JPEG, PNG, WebP ili BMP — do 8 MB</small>
        </div>
      </div>
      <div class="staged hidden" id="staged">
        <img id="thumb" alt="izabrana slika">
        <div class="nm"><b id="fname"></b><span id="fsize"></span></div>
      </div>
      <div class="tools">
        <button class="tool" id="pick" title="Izaberi sliku">
          <svg viewBox="0 0 24 24"><path d="M21 11.5 12.6 20a5 5 0 0 1-7-7l8.3-8.4a3.3 3.3 0 1 1 4.7 4.7l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.8-7.7"/></svg>
        </button>
        <button class="tool hidden" id="clear" title="Ukloni sliku">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="gap"></div>
        <button class="send" id="send" disabled title="Prepoznaj">
          <svg viewBox="0 0 24 24"><path d="M3.5 12 20.5 4l-3.4 16-5-5.6-5.6-2.4z"/></svg>
        </button>
      </div>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/bmp" class="hidden">
    </div>

    <div class="chips" id="chips">
      <span class="chip"><i>rasa</i> 120</span>
      <span class="chip"><i>top-3 tacnost</i> 98,25%</span>
      <span class="chip"><i>p95</i> ~49 ms</span>
      <span class="chip"><i>model</i> 16,6 MB</span>
    </div>

    <div class="result hidden" id="result"></div>

    <!-- bocni panel -->
    <div class="overlay" id="overlay">
      <aside class="panel" id="panel">
        <button class="rbtn x" id="panel-x" title="Zatvori">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div id="panel-body"></div>
      </aside>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const pretty = s => String(s).replace(/_/g, ' ');
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let staged = null, stagedUrl = null, lastId = null, breeds = [], history = [];

/* ---------- izbor fajla ---------- */
function stage(f) {
  if (!f) return;
  if (stagedUrl) URL.revokeObjectURL(stagedUrl);
  staged = f; stagedUrl = URL.createObjectURL(f);
  $('thumb').src = stagedUrl;
  $('fname').textContent = f.name;
  $('fsize').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  $('dz').classList.add('hidden');
  $('staged').classList.remove('hidden');
  $('clear').classList.remove('hidden');
  $('send').disabled = false;
}
function unstage() {
  if (stagedUrl) URL.revokeObjectURL(stagedUrl);
  staged = null; stagedUrl = null; $('file').value = '';
  $('dz').classList.remove('hidden');
  $('staged').classList.add('hidden');
  $('clear').classList.add('hidden');
  $('send').disabled = true;
}
$('dz').addEventListener('click', () => $('file').click());
$('pick').addEventListener('click', () => $('file').click());
$('clear').addEventListener('click', unstage);
$('file').addEventListener('change', e => stage(e.target.files[0]));

const comp = $('composer');
['dragenter','dragover'].forEach(ev => comp.addEventListener(ev, e => {
  e.preventDefault(); comp.classList.add('over');
}));
['dragleave','drop'].forEach(ev => comp.addEventListener(ev, e => {
  e.preventDefault(); comp.classList.remove('over');
}));
comp.addEventListener('drop', e => stage(e.dataTransfer.files[0]));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

/* ---------- predikcija ---------- */
$('send').addEventListener('click', predict);

async function predict() {
  if (!staged) return;
  const url = stagedUrl, name = staged.name;
  $('send').disabled = true;
  $('hero').classList.add('hidden');
  $('chips').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('result').innerHTML =
    '<div class="card"><p class="msg"><span class="spin"></span>Prepoznajem…</p></div>';

  const fd = new FormData();
  fd.append('file', staged);
  let r, d;
  try {
    r = await fetch('/predict', { method:'POST', body:fd });
    d = await r.json();
  } catch (e) {
    $('result').innerHTML =
      '<div class="card"><p class="msg err">Servis ne odgovara. Da li je pokrenut?</p></div>';
    $('send').disabled = false;
    return;
  }
  if (!r.ok) {
    $('result').innerHTML =
      '<div class="card"><p class="msg err">' + esc(d.detail || 'Greska ' + r.status) + '</p></div>';
    $('send').disabled = false;
    return;
  }
  render(d, url, name);
  history.unshift({ breed:d.predictions[0].breed, p:d.predictions[0].probability,
                    ms:d.latency_ms, ok:d.confident && d.is_dog });
  $('send').disabled = false;
}

function render(d, url, name) {
  lastId = d.request_id;
  const top = d.predictions[0];
  const rows = d.predictions.map((p, i) =>
    '<div class="row"><span class="rank">' + (i+1) + '</span>' +
    '<span class="breed">' + esc(pretty(p.breed)) + '</span>' +
    '<span class="bar"><span style="width:' + Math.max(2, p.probability*100).toFixed(1) + '%"></span></span>' +
    '<span class="pct">' + (p.probability*100).toFixed(1) + '%</span></div>').join('');

  $('result').innerHTML =
    '<div class="card">' +
      '<div class="shot"><img src="' + url + '" alt="poslata slika">' +
        '<div class="hd"><h2>' + esc(pretty(top.breed)) + '</h2>' +
        '<p>' + esc(name) + ' · ' + (top.probability*100).toFixed(1) + '% za prvi odgovor</p></div>' +
      '</div>' +
      (d.message ? '<div class="note"><span>!</span><span>' + esc(d.message) + '</span></div>' : '') +
      rows +
      '<div class="meta">' +
        '<span class="tag">' + d.latency_ms.toFixed(0) + ' ms</span>' +
        '<span class="tag">poverenje ' + (d.signals.top3_mass*100).toFixed(1) + '%</span>' +
        (d.dog_score !== null ? '<span class="tag">pas ' + (d.dog_score*100).toFixed(0) + '%</span>' : '') +
        '<span class="tag">' + esc(d.model_version) + '</span>' +
      '</div>' +
      '<div class="fb"><label for="corr">Nije tacno? Upisi pravu rasu — koristi se za ucenje.</label>' +
        '<div class="ln">' +
          '<input id="corr" list="bl" placeholder="npr. cocker_spaniel" autocomplete="off">' +
          '<button class="btn" id="fb-send">Posalji</button>' +
        '</div><datalist id="bl"></datalist><p class="msg" id="fb-msg"></p></div>' +
    '</div>';

  $('bl').innerHTML = breeds.map(b => '<option value="' + esc(b) + '">').join('');
  $('fb-send').addEventListener('click', sendFeedback);
  $('corr').addEventListener('keydown', e => { if (e.key === 'Enter') sendFeedback(); });
}

async function sendFeedback() {
  const inp = $('corr'), msg = $('fb-msg'), btn = $('fb-send');
  const val = inp.value.trim();
  if (!val) return;
  btn.disabled = true;
  try {
    const r = await fetch('/feedback', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ request_id:lastId, correct_breed:val })
    });
    const d = await r.json();
    msg.className = r.ok ? 'msg' : 'msg err';
    msg.textContent = r.ok
      ? (d.was_top1 ? 'Hvala — to je i bio prvi odgovor.'
                    : d.was_top3 ? 'Hvala — bila je medju prva tri.'
                                 : 'Hvala, zabelezeno kao promasaj.')
      : (d.detail || 'Greska');
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = 'Servis ne odgovara.';
  }
  btn.disabled = false;
}

/* ---------- leva traka: akcije ---------- */
function reset() {
  unstage();
  $('result').classList.add('hidden');
  $('result').innerHTML = '';
  $('hero').classList.remove('hidden');
  $('chips').classList.remove('hidden');
}
$('nav-new').addEventListener('click', reset);

function openPanel(html) { $('panel-body').innerHTML = html; $('overlay').classList.add('open'); }
function closePanel() { $('overlay').classList.remove('open'); }
$('panel-x').addEventListener('click', closePanel);
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

$('nav-hist').addEventListener('click', () => {
  const body = history.length
    ? '<div class="plist">' + history.map(h =>
        '<div class="pitem"><span class="k">' + esc(pretty(h.breed)) + '</span>' +
        '<span class="v">' + (h.p*100).toFixed(0) + '% · ' + h.ms.toFixed(0) + ' ms</span></div>').join('') +
      '</div>'
    : '<p class="ph">Jos nema predikcija u ovoj sesiji.</p>';
  openPanel('<h3>Istorija</h3><p class="ph">Samo ova kartica u pregledacu. ' +
            'Trajni dnevnik je u SQLite bazi servisa.</p>' + body);
});

$('nav-breeds').addEventListener('click', () => {
  openPanel('<h3>Rase</h3><p class="ph">' + breeds.length + ' klasa koje model poznaje.</p>' +
            '<div class="pgrid">' + breeds.map(b => '<span>' + esc(pretty(b)) + '</span>').join('') + '</div>');
});

$('nav-status').addEventListener('click', async () => {
  openPanel('<h3>Status</h3><p class="ph"><span class="spin"></span>ucitavam…</p>');
  try {
    const h = await (await fetch('/health')).json();
    const c = h.counts || {};
    const rows = [
      ['status', h.status],
      ['model', h.model_version],
      ['rasa', h.n_classes],
      ['kapija "nije pas"', h.dog_gate ? 'ukljucena' : 'iskljucena'],
      ['prag', h.threshold.signal + ' ≥ ' + Number(h.threshold.value).toFixed(3)],
      ['drift', h.drift && h.drift.enabled
        ? (h.drift.status || 'jos nije racunat') +
          (h.drift.worst_psi != null ? ' (PSI ' + h.drift.worst_psi.toFixed(3) + ')' : '')
        : 'iskljucen'],
      ['uptime', Math.round(h.uptime_s) + ' s'],
      ['predikcija u bazi', c.predictions ?? 0],
      ['povratnih informacija', c.feedback ?? 0],
    ];
    openPanel('<h3>Status</h3><p class="ph">Iz <code>GET /health</code>.</p><div class="plist">' +
      rows.map(([k,v]) => '<div class="pitem"><span class="k">' + esc(k) +
               '</span><span class="v">' + esc(v) + '</span></div>').join('') + '</div>');
  } catch (e) {
    openPanel('<h3>Status</h3><p class="msg err">Servis ne odgovara.</p>');
  }
});

/* ---------- pocetno stanje ---------- */
(async function boot() {
  try {
    const h = await (await fetch('/health')).json();
    $('sdot').classList.remove('off');
    $('slabel').textContent = 'servis spreman · ' + h.model_version;
  } catch (e) {
    $('slabel').textContent = 'servis ne odgovara';
  }
  try { breeds = (await (await fetch('/breeds')).json()).breeds; } catch (e) {}
})();
</script>
</body>
</html>
